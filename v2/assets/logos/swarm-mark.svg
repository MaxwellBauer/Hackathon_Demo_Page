<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Swarm</title>
  <desc id="desc">Connected agents assembling into the letter S.</desc>
  <style>
    .bond {
      fill: none;
      stroke: #f7f2e6;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
      opacity: .76;
      animation: draw 1.1s cubic-bezier(.2,.75,.25,1) forwards;
    }
    .node {
      fill: #f7f2e6;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(.25);
      animation: arrive .48s cubic-bezier(.2,.85,.3,1.25) forwards;
    }
    .node:nth-of-type(3n) { animation-delay: .12s; }
    .node:nth-of-type(3n + 1) { animation-delay: .24s; }
    .node:nth-of-type(3n + 2) { animation-delay: .36s; }
    .signal { fill: #f2c15a; filter: drop-shadow(0 0 3px #d9a038); }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes arrive { to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .bond { animation: none; stroke-dashoffset: 0; }
      .node { animation: none; opacity: 1; transform: none; }
      .signal { display: none; }
    }
  </style>
  <path class="bond" d="M76 15 59 9 39 12 23 22 16 34 28 43 48 47 68 52 79 64 71 78 52 87 32 83 18 72M76 15 87 25M39 12 27 6M16 34 7 45M68 52 88 47M71 78 84 87M32 83 18 91"/>
  <g>
    <circle class="node" cx="76" cy="15" r="4.2"/><circle class="node" cx="59" cy="9" r="3.2"/>
    <circle class="node" cx="39" cy="12" r="3.8"/><circle class="node" cx="23" cy="22" r="3.1"/>
    <circle class="node" cx="16" cy="34" r="4.4"/><circle class="node" cx="28" cy="43" r="3.1"/>
    <circle class="node" cx="48" cy="47" r="5.5"/><circle class="node" cx="68" cy="52" r="3.4"/>
    <circle class="node" cx="79" cy="64" r="4.3"/><circle class="node" cx="71" cy="78" r="3.2"/>
    <circle class="node" cx="52" cy="87" r="3.8"/><circle class="node" cx="32" cy="83" r="3.2"/>
    <circle class="node" cx="18" cy="72" r="4.2"/><circle class="node" cx="87" cy="25" r="2.4"/>
    <circle class="node" cx="27" cy="6" r="2.1"/><circle class="node" cx="7" cy="45" r="2.5"/>
    <circle class="node" cx="88" cy="47" r="2.2"/><circle class="node" cx="84" cy="87" r="2.5"/>
    <circle class="node" cx="18" cy="91" r="2.1"/>
  </g>
  <circle class="signal" r="2.8">
    <animateMotion dur="5s" begin="1.1s" repeatCount="indefinite" path="M76 15 59 9 39 12 23 22 16 34 28 43 48 47 68 52 79 64 71 78 52 87 32 83 18 72"/>
  </circle>
</svg>
