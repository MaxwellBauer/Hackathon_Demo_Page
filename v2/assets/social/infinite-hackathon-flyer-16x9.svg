    <rect x="1112" y="109" width="374" height="682" rx="4" fill="none" stroke="#d9a038" stroke-opacity=".26"/>
    <text x="1299" y="167" text-anchor="middle" class="mono" font-size="18" letter-spacing="4" fill="#d9a038">APPLICATIONS OPEN</text>

